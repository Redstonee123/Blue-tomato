<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>番茄钟 - Feishu 风格原型</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --card: #ffffff;
      --text: #1f2329;
      --muted: #646a73;
      --line: #e5e6eb;
      --primary: #1664ff;
      --primary-soft: rgba(22, 100, 255, 0.12);
      --success: #00b578;
      --shadow: 0 10px 30px rgba(31, 35, 41, 0.08);
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "MiSans", "HarmonyOS Sans", "OPPO Sans", "PingFang SC", "Microsoft YaHei UI", "Segoe UI", sans-serif;
      color: var(--text);
      background: radial-gradient(1200px 600px at 10% 10%, #eef3ff 0, transparent 60%),
        radial-gradient(900px 500px at 90% 0%, #fff2f2 0, transparent 55%),
        var(--bg);
      min-height: 100vh;
    }

    .app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 600;
    }

    .brand-badge {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: #ffffff url("./blue-tomato.png") center/cover no-repeat;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
    }

    .goal {
      color: var(--muted);
      font-size: 14px;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 16px;
      color: var(--muted);
      font-size: 14px;
    }

    .avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1664ff, #7aa7ff);
    }

    .content {
      display: grid;
      grid-template-columns: 240px minmax(520px, 1fr) 300px;
      gap: 24px;
      padding: 28px;
      flex: 1;
      align-items: start;
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid rgba(31, 35, 41, 0.04);
      padding: 18px;
      animation: floatIn 0.6s ease forwards;
      opacity: 0;
    }

    .card.delay-1 { animation-delay: 0.1s; }
    .card.delay-2 { animation-delay: 0.18s; }
    .card.delay-3 { animation-delay: 0.26s; }

    .panel-title {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .left-panel {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .kv {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      font-size: 14px;
    }

    .kv strong {
      color: var(--text);
      font-weight: 600;
    }

    .progress {
      height: 10px;
      background: #f0f1f3;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 10px;
    }

    .progress > span {
      display: block;
      height: 100%;
      width: 38%;
      background: linear-gradient(90deg, #1664ff, #6aa0ff);
      border-radius: 999px;
    }

    .center-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .timer-ring {
      width: 320px;
      height: 320px;
      border-radius: 50%;
      background: conic-gradient(var(--primary) calc(var(--progress) * 1%), #e9edf7 0%);
      display: grid;
      place-items: center;
      position: relative;
      transition: background 0.4s ease;
    }

    .timer-ring::after {
      content: "";
      position: absolute;
      width: 250px;
      height: 250px;
      background: #ffffff;
      border-radius: 50%;
      box-shadow: inset 0 0 0 1px #eef0f4;
    }

    .timer-core {
      position: relative;
      z-index: 1;
      text-align: center;
    }

    .timer-label {
      font-size: 14px;
      color: var(--muted);
      letter-spacing: 1px;
    }

    .timer-value {
      font-size: 56px;
      font-weight: 700;
      margin: 12px 0 4px;
      font-variant-numeric: tabular-nums;
    }

    .timer-sub {
      font-size: 13px;
      color: var(--muted);
    }

    .controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      border: 1px solid var(--line);
      background: #fff;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 14px;
      color: var(--text);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn:hover {
      border-color: rgba(22, 100, 255, 0.4);
      box-shadow: 0 6px 16px rgba(22, 100, 255, 0.12);
    }

    .btn.disabled,
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      pointer-events: none;
      box-shadow: none;
    }

    .btn.primary {
      background: var(--primary);
      color: #fff;
      border-color: transparent;
      box-shadow: 0 10px 22px rgba(22, 100, 255, 0.25);
    }

    .btn.ghost {
      background: var(--primary-soft);
      color: var(--primary);
      border-color: transparent;
    }

    .hint {
      font-size: 13px;
      color: var(--muted);
    }

    .right-panel {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .task {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-radius: 10px;
      background: #f7f8fa;
      font-size: 14px;
      gap: 8px;
      border: 1px dashed transparent;
    }

    .task span {
      color: var(--text);
    }

    .task small {
      color: var(--muted);
    }

    .tag {
      font-size: 12px;
      padding: 4px 10px;
      background: #eef3ff;
      color: #3c7dff;
      border-radius: 999px;
    }

    .task-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .btn.small {
      padding: 6px 12px;
      font-size: 12px;
      border-radius: 10px;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .dropping {
      border-color: #cdd5ff;
      background: rgba(22, 100, 255, 0.04);
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 20;
      padding: 16px;
    }

    .modal.active {
      display: flex;
    }

    .modal-card {
      width: min(420px, 100%);
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid rgba(31, 35, 41, 0.08);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 14px;
    }

    .field label {
      color: var(--muted);
    }

    .field input {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .field input:focus {
      border-color: rgba(22, 100, 255, 0.45);
      box-shadow: 0 0 0 3px rgba(22, 100, 255, 0.12);
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 6px;
    }

    .footer-note {
      margin-top: auto;
      font-size: 12px;
      color: var(--muted);
      text-align: center;
      padding: 0 20px 24px;
    }

    @keyframes floatIn {
      from {
        transform: translateY(18px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    @media (max-width: 1100px) {
      .content {
        grid-template-columns: 1fr;
      }

      .left-panel,
      .right-panel {
        flex-direction: row;
        flex-wrap: wrap;
      }

      .timer-ring {
        width: 260px;
        height: 260px;
      }

      .timer-ring::after {
        width: 200px;
        height: 200px;
      }
    }

    @media (max-width: 680px) {
      .topbar {
        flex-direction: column;
        height: auto;
        gap: 10px;
        padding: 12px 16px;
        align-items: center;
      }

      .content {
        grid-template-columns: 1fr;
        padding: 16px;
        gap: 16px;
      }

      .left-panel,
      .right-panel,
      .center-panel {
        width: 100%;
      }

      .card {
        width: 100%;
      }

      .controls {
        gap: 8px;
        justify-content: center;
      }

      .btn {
        padding: 8px 14px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-badge"></div>
        <div>蓝番茄</div>
      </div>
    </header>

    <main class="content">
      <section class="left-panel">
        <div class="card delay-1">
          <div class="panel-title">任务进度</div>
          <div class="kv"><span>当前任务</span><strong id="currentTaskNumber">0</strong></div>
          <div class="kv"><span>已完成</span><strong id="completedCount">0</strong></div>
          <div class="kv"><span>总任务</span><strong id="totalCount">0</strong></div>
          <div class="panel-title" style="margin-top: 12px;">今日进度</div>
          <div class="progress"><span id="progressFill" style="width: 0%;"></span></div>
        </div>

        <div class="card delay-2">
          <div class="panel-title">任务节奏</div>
          <div class="kv"><span>专注时长</span><strong>25 分钟</strong></div>
          <div class="kv"><span>长休间隔</span><strong>每 4 次</strong></div>
          <button class="btn ghost" id="adjustBtn" style="width: 100%; margin-top: 8px;">调整节奏</button>
        </div>
      </section>

      <section class="center-panel">
        <div class="card delay-2" style="width: 100%; display: grid; place-items: center;">
          <div class="timer-ring" id="ring" style="--progress: 0.0;">
            <div class="timer-core">
              <div class="timer-label">专注中</div>
              <div class="timer-value" id="timer">25:00</div>
              <div class="timer-sub">计划任务：写日报</div>
            </div>
          </div>
        </div>

        <div class="controls">
          <button class="btn primary" id="startPauseBtn">开始</button>
          <button class="btn" id="endBtn">结束</button>
          <button class="btn" id="resetBtn">重置</button>
          <button class="btn" id="skipBtn">跳过</button>
        </div>
        <div class="hint">提示：保持专注，结束后自动进入短休。</div>
      </section>

      <section class="right-panel">
        <div class="card delay-1">
          <div class="panel-title">任务列表</div>
          <div id="taskList" class="list">
            <div class="task" draggable="true" data-duration="25" data-name="写日报">
              <div class="task-actions">
                <span>写日报</span><small>25m</small>
              </div>
              <div class="task-actions">
                <button class="btn small ghost" data-action="start-task">开始</button>
                <button class="btn small" data-action="edit-task">编辑</button>
              </div>
            </div>
            <div class="task" draggable="true" data-duration="25" data-name="读文档">
              <div class="task-actions">
                <span>读文档</span><small>25m</small>
              </div>
              <div class="task-actions">
                <button class="btn small ghost" data-action="start-task">开始</button>
                <button class="btn small" data-action="edit-task">编辑</button>
              </div>
            </div>
            <div class="task" draggable="true" data-duration="25" data-name="复盘">
              <div class="task-actions">
                <span>复盘</span><small>25m</small>
              </div>
              <div class="task-actions">
                <button class="btn small ghost" data-action="start-task">开始</button>
                <button class="btn small" data-action="edit-task">编辑</button>
              </div>
            </div>
          </div>
          <button class="btn" id="newTaskBtn" style="width: 100%; margin-top: 10px;">+ 新任务</button>
        </div>
        <div class="card delay-2">
          <div class="panel-title">已完成任务</div>
          <div id="doneList" class="list">
            <div style="font-size: 13px; color: var(--muted);" id="doneEmpty">暂无已完成任务</div>
          </div>
        </div>
      </section>
    </main>

  </div>

  <!-- 新任务弹窗 -->
  <div class="modal" id="taskModal">
    <div class="modal-card">
      <div class="panel-title" style="margin-bottom: 4px;">新任务</div>
      <div class="field">
        <label for="taskName">任务名称</label>
        <input id="taskName" placeholder="例如：写日报" />
      </div>
      <div class="field">
        <label for="taskDuration">预计时长（分钟）</label>
        <input id="taskDuration" type="number" min="1" max="120" value="25" />
      </div>
      <div class="modal-actions">
        <button class="btn" id="cancelTask">取消</button>
        <button class="btn primary" id="saveTask">保存</button>
      </div>
    </div>
  </div>

  <!-- 调整节奏弹窗 -->
  <div class="modal" id="rhythmModal">
    <div class="modal-card">
      <div class="panel-title" style="margin-bottom: 4px;">调整节奏</div>
      <div class="field">
        <label for="focusLength">专注时长（分钟）</label>
        <input id="focusLength" type="number" min="10" max="60" value="25" />
      </div>
      <div class="field">
        <label for="shortBreak">短休时长（分钟）</label>
        <input id="shortBreak" type="number" min="3" max="20" value="5" />
      </div>
      <div class="modal-actions">
        <button class="btn" id="cancelRhythm">取消</button>
        <button class="btn primary" id="saveRhythm">保存</button>
      </div>
    </div>
  </div>

  <script>
    let focusSeconds = 25 * 60;
    let breakSeconds = 5 * 60;
    let currentSegmentSeconds = focusSeconds;
    let remaining = currentSegmentSeconds;
    let timerId = null;
    let isRunning = false;
    let segmentQueue = [];
    let currentTaskName = "";
    let phase = "focus"; // focus | break
    let currentTaskEl = null;
    let editingTaskEl = null;
    let audioCtx = null;

    const startPauseBtn = document.getElementById("startPauseBtn");
    const timerEl = document.getElementById("timer");
    const ringEl = document.getElementById("ring");
    const taskListEl = document.getElementById("taskList");
    const doneListEl = document.getElementById("doneList");
    const timerSubEl = document.querySelector(".timer-sub");
    const timerLabelEl = document.querySelector(".timer-label");
    const doneEmptyEl = document.getElementById("doneEmpty");
    const totalCountEl = document.getElementById("totalCount");
    const completedCountEl = document.getElementById("completedCount");
    const currentTaskNumberEl = document.getElementById("currentTaskNumber");
    const progressFillEl = document.getElementById("progressFill");

    function formatTime(value) {
      const mins = Math.floor(value / 60);
      const secs = value % 60;
      return `${String(mins).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;
    }

    function updateUI() {
      timerEl.textContent = formatTime(remaining);
      const total = phase === "focus" ? currentSegmentSeconds : breakSeconds;
      const progress = total > 0 ? 100 - (remaining / total) * 100 : 0;
      ringEl.style.setProperty("--progress", progress.toFixed(2));
      startPauseBtn.textContent = isRunning ? "暂停" : "开始";
      timerLabelEl.textContent = phase === "focus" ? "专注中" : "休息中";
      if (phase === "focus") {
        timerSubEl.textContent = currentTaskName ? `计划任务：${currentTaskName}` : "计划任务：—";
      } else {
        timerSubEl.textContent = "放松一下，准备下一段专注";
      }
      updateStats();
    }

    function initAudio() {
      if (!audioCtx) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (Ctx) audioCtx = new Ctx();
      }
    }

    function playBeep() {
      if (!audioCtx) return;
      const ctx = audioCtx;
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.3, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.3);
      osc.connect(gain).connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.32);
    }

    function startTimer() {
      initAudio();
      if (timerId) return;
      timerId = setInterval(() => {
        if (remaining > 0) {
          remaining -= 1;
          updateUI();
        } else {
          if (phase === "focus") {
            if (segmentQueue.length > 0) {
              startBreak();
            } else {
              endFlow();
            }
          } else {
            if (segmentQueue.length > 0) {
              startNextSegment();
            } else {
              endFlow();
            }
          }
        }
      }, 1000);
      isRunning = true;
      startPauseBtn.textContent = "暂停";
    }

    function pauseTimer() {
      if (!timerId) return;
      clearInterval(timerId);
      timerId = null;
      isRunning = false;
      startPauseBtn.textContent = "开始";
    }

    function resetTimer() {
      pauseTimer();
      segmentQueue = [];
      currentTaskName = "";
      currentTaskEl = null;
      phase = "focus";
      currentSegmentSeconds = focusSeconds;
      remaining = focusSeconds;
      updateUI();
    }

    startPauseBtn.addEventListener("click", () => {
      initAudio();
      if (isRunning) {
        pauseTimer();
      } else {
        startTimer();
      }
    });

    document.getElementById("resetBtn").addEventListener("click", resetTimer);

    // 弹窗公用函数
    function openModal(modal) {
      modal.classList.add("active");
    }

    function closeModal(modal) {
      modal.classList.remove("active");
    }

    // 新任务 / 编辑
    const taskModal = document.getElementById("taskModal");
    document.getElementById("newTaskBtn").addEventListener("click", () => {
      editingTaskEl = null;
      document.getElementById("taskName").value = "";
      document.getElementById("taskDuration").value = "25";
      openModal(taskModal);
    });
    document.getElementById("cancelTask").addEventListener("click", () => {
      closeModal(taskModal);
      editingTaskEl = null;
    });

    // 调整节奏
    const rhythmModal = document.getElementById("rhythmModal");
    document.getElementById("adjustBtn").addEventListener("click", () => openModal(rhythmModal));
    document.getElementById("cancelRhythm").addEventListener("click", () => closeModal(rhythmModal));
    document.getElementById("saveRhythm").addEventListener("click", () => {
      const focusMin = Math.max(10, Math.min(60, parseInt(document.getElementById("focusLength").value, 10) || 25));
      const breakMin = Math.max(3, Math.min(20, parseInt(document.getElementById("shortBreak").value, 10) || 5));
      focusSeconds = focusMin * 60;
      breakSeconds = breakMin * 60;
      currentSegmentSeconds = focusSeconds;
      resetTimer();
      closeModal(rhythmModal);
    });

    function buildSegments(totalMinutes, focusMinutes) {
      const segs = [];
      let remainingMinutes = totalMinutes;
      while (remainingMinutes > 0) {
        const chunk = Math.min(focusMinutes, remainingMinutes);
        segs.push(chunk);
        remainingMinutes -= chunk;
      }
      return segs;
    }

    function createTaskElement(name, duration) {
      const row = document.createElement("div");
      row.className = "task";
      row.setAttribute("draggable", "true");
      row.setAttribute("data-duration", duration.toString());
      row.setAttribute("data-name", name);
      row.innerHTML = `
        <div class="task-actions">
          <span>${name}</span><small>${duration}m</small>
        </div>
        <div class="task-actions">
          <button class="btn small ghost" data-action="start-task">开始</button>
          <button class="btn small" data-action="edit-task">编辑</button>
        </div>
      `;
      attachDrag(row);
      return row;
    }

    function moveToDone(taskEl) {
      if (!taskEl) return;
      if (doneEmptyEl && doneEmptyEl.parentElement) {
        doneEmptyEl.remove();
      }
      setTaskState(taskEl, "done");
      doneListEl.appendChild(taskEl);
      checkDoneEmpty();
      updateStats();
    }

    let dragItem = null;

    function attachDrag(el) {
      el.addEventListener("dragstart", (ev) => {
        dragItem = el;
        el.classList.add("dropping");
        if (ev.dataTransfer) {
          ev.dataTransfer.setData("text/plain", "drag");
          ev.dataTransfer.effectAllowed = "move";
        }
      });
      el.addEventListener("dragend", () => {
        el.classList.remove("dropping");
      });
    }

    function setupDropZone(zone) {
      zone.addEventListener("dragover", (ev) => {
        ev.preventDefault();
        zone.classList.add("dropping");
      });
      zone.addEventListener("dragleave", () => {
        zone.classList.remove("dropping");
      });
      zone.addEventListener("drop", (ev) => {
        ev.preventDefault();
        zone.classList.remove("dropping");
        if (dragItem) {
          zone.appendChild(dragItem);
          const toActive = zone === taskListEl;
          setTaskState(dragItem, toActive ? "active" : "done");
          dragItem = null;
          checkDoneEmpty();
          updateStats();
        }
      });
    }

    function checkDoneEmpty() {
      const hasTask = !!doneListEl.querySelector(".task");
      if (!hasTask && doneEmptyEl && !doneEmptyEl.parentElement) {
        doneListEl.appendChild(doneEmptyEl);
      }
    }

    function updateStats() {
      const totalTasks = document.querySelectorAll(".right-panel .task").length;
      const doneTasks = doneListEl.querySelectorAll(".task").length;
      const currentNumber = totalTasks === 0 ? 0 : Math.min(totalTasks, doneTasks + 1);
      totalCountEl.textContent = totalTasks.toString();
      completedCountEl.textContent = doneTasks.toString();
      currentTaskNumberEl.textContent = currentNumber.toString();
      const ratio = totalTasks > 0 ? (doneTasks / totalTasks) * 100 : 0;
      progressFillEl.style.width = `${ratio.toFixed(0)}%`;
    }

    function setFocusSegment(minutes, taskName) {
      currentSegmentSeconds = minutes * 60;
      remaining = currentSegmentSeconds;
      phase = "focus";
      if (taskName !== undefined) currentTaskName = taskName;
      updateUI();
    }

    function setTaskState(taskEl, state) {
      const actionBars = taskEl.querySelectorAll(".task-actions");
      const buttonsBar = actionBars[actionBars.length - 1];
      if (!buttonsBar) return;
      if (state === "active") {
        buttonsBar.innerHTML = `
          <button class="btn small ghost" data-action="start-task">开始</button>
          <button class="btn small" data-action="edit-task">编辑</button>
        `;
      } else {
        buttonsBar.innerHTML = `
          <button class="btn small ghost" data-action="copy-task">复制</button>
        `;
      }
    }

    function startBreak() {
      phase = "break";
      remaining = breakSeconds;
      updateUI();
    }

    function startNextSegment() {
      const next = segmentQueue.shift();
      if (typeof next === "number") {
        setFocusSegment(next, currentTaskName);
      } else {
        endFlow();
      }
    }

    function endFlow() {
      pauseTimer();
      segmentQueue = [];
      currentTaskName = "";
      if (currentTaskEl) {
        moveToDone(currentTaskEl);
      }
      currentTaskEl = null;
      phase = "focus";
      currentSegmentSeconds = focusSeconds;
      remaining = currentSegmentSeconds;
      playBeep();
      updateUI();
    }

    function handleTaskClick(container, e) {
      const target = e.target;
      if (!(target instanceof HTMLElement)) return;
      const action = target.dataset.action;
      if (!action) return;
      const taskEl = target.closest(".task");
      if (!taskEl) return;
      const name = taskEl.getAttribute("data-name") || "";
      const duration = parseInt(taskEl.getAttribute("data-duration") || "25", 10);

      if (action === "start-task") {
        initAudio();
        pauseTimer();
        segmentQueue = buildSegments(duration, focusSeconds / 60);
        const first = segmentQueue.shift();
        setFocusSegment(first || focusSeconds / 60, name);
        currentTaskEl = taskEl;
        startTimer();
      }

      if (action === "edit-task") {
        editingTaskEl = taskEl;
        document.getElementById("taskName").value = name;
        document.getElementById("taskDuration").value = duration.toString();
        openModal(taskModal);
      }

      if (action === "copy-task") {
        const copy = createTaskElement(name, duration);
        taskListEl.appendChild(copy);
        checkDoneEmpty();
        updateStats();
      }
    }

    taskListEl.addEventListener("click", (e) => handleTaskClick(taskListEl, e));
    doneListEl.addEventListener("click", (e) => handleTaskClick(doneListEl, e));

    // 拖拽初始化
    document.querySelectorAll("#taskList .task, #doneList .task").forEach(attachDrag);
    setupDropZone(taskListEl);
    setupDropZone(doneListEl);
    checkDoneEmpty();

    // 保存任务（新建/编辑）
    document.getElementById("saveTask").addEventListener("click", () => {
      const name = document.getElementById("taskName").value.trim() || "新任务";
      const duration = Math.max(1, Math.min(120, parseInt(document.getElementById("taskDuration").value, 10) || 25));

      if (editingTaskEl) {
        editingTaskEl.setAttribute("data-name", name);
        editingTaskEl.setAttribute("data-duration", duration.toString());
        const labelSpan = editingTaskEl.querySelector(".task-actions span");
        const labelSmall = editingTaskEl.querySelector(".task-actions small");
        if (labelSpan) labelSpan.textContent = name;
        if (labelSmall) labelSmall.textContent = `${duration}m`;
      } else {
        const row = createTaskElement(name, duration);
        taskListEl.appendChild(row);
      }

      closeModal(taskModal);
      document.getElementById("taskName").value = "";
      document.getElementById("taskDuration").value = "25";
      editingTaskEl = null;
      updateStats();
    });

    // 结束按钮：停止当前番茄并清空队列
    document.getElementById("endBtn").addEventListener("click", () => {
      endFlow();
    });

    // 跳过：专注时跳到休息，休息时跳到下一段专注或结束
    document.getElementById("skipBtn").addEventListener("click", () => {
      const wasRunning = isRunning;
      pauseTimer();
      if (phase === "focus") {
        startBreak();
      } else {
        if (segmentQueue.length > 0) {
          startNextSegment();
        } else {
          endFlow();
        }
      }
      if (wasRunning) startTimer();
    });

    updateStats();
    updateUI();
  </script>
</body>
</html>
